# use docker to start an ephemeral build container:
#   docker run --rm -it \
#     -v (pwd):/config
#     --tmpfs /config/.esphome/
#     --entrypoint bash
#     --device /dev/ttyACM*
#       ghcr.io/esphome/esphome:2025.10.3

esphome:
  name: luftctl

  on_boot:
    - then:
      - switch.turn_on: enable12v
      - fan.turn_off: fan1_control
      - fan.turn_off: fan2_control

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    
logger:
  level: DEBUG

api: # homeassistant integration
  encryption:
    key: !secret homeassistant_key

ota: # flash updates
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: luftctl.fritz.box
  fast_connect: true

time:

  - id: ntp
    platform: sntp
    timezone: Europe/Berlin
    servers: [ fritz.box ]

binary_sensor:

  # Button input on GPIO: https://esphome.io/components/binary_sensor/gpio/

  - id: button
    name: Button
    platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true

sensor:

  # FAN tachometer inputs: https://esphome.io/components/sensor/pulse_counter/

  - id: fan1_tacho
    name: FAN1 Tachometer
    platform: pulse_counter
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
    update_interval: 5s
    unit_of_measurement: RPM
    filters:
      - multiply: 0.5
      - round: 0

  - id: fan2_tacho
    name: FAN2 Tachometer
    platform: pulse_counter
    pin:
      number: GPIO7
      mode:
        input: true
        pullup: true
    update_interval: 5s
    unit_of_measurement: RPM
    filters:
      - multiply: 0.5
      - round: 0

output:
    
  # PWM outputs for FAN and LED: https://esphome.io/components/output/ledc/

  - id: fan1_pwm
    platform: ledc
    pin: GPIO4
    frequency: 25kHz

  - id: fan2_pwm
    platform: ledc
    pin: GPIO6
    frequency: 25kHz

switch:

  # Enable boost converter with GPIO: https://esphome.io/components/output/gpio/

  - id: enable12v
    name: Enable 12V Boost
    platform: gpio
    pin: GPIO3

fan:

  # Speed controls for the FAN outputs: https://esphome.io/components/fan/

  - id: fan1_control
    name: FAN1 Control
    platform: speed
    output: fan1_pwm

  - id: fan2_control
    name: FAN2 Control
    platform: speed
    output: fan2_pwm

light:

  # LED as status indicator: https://esphome.io/components/light/status_led/

  - id: led
    name: LED
    platform: status_led
    pin: GPIO10
